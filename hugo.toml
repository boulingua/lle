# ─────────────────────────────────────────────────────────────────────────
# lle — boulingua Latin course (Hugo + hugo-coder), instantiated from pagegen.
#
# Latin is the object language; English is the metalanguage of the site chrome
# and of the teaching apparatus, hence languageCode = "la" with
# defaultContentLanguage = "en". Everything outside the values marked below is
# the shared pagegen standard and is deliberately left untouched.
# ─────────────────────────────────────────────────────────────────────────

baseURL = "https://boulingua.github.io/lle/"
title = "Latin — S. Le Boulanger"
languageCode = "la"
defaultContentLanguage = "en"
enableEmoji = false
enableRobotsTXT = true

[pagination]
  pagerSize = 20

[markup.highlight]
  noClasses = false

[markup.goldmark.renderer]
  unsafe = true

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3
  ordered = false

# Tags are DECLARED, not implicit — derive them from structured fields.
[taxonomies]
  tag = "tags"
  skill = "skills"
  level = "levels"
  topic = "topics"

[params]
  navTitle = "Latin"
  author = "S. Le Boulanger"
  description = "A free, openly-licensed course in reading classical Latin — morphology, syntax and the canonical texts — from the alphabet to unadapted Caesar, Cicero, Ovid and Vergil."
  keywords = "Latin,Latinum,CEFR reception,reading,classical,grammar,OER"
  dateFormat = "2006-01-02"
  since = 2025
  colorScheme = "auto"
  hideCredits = true
  # The colour-scheme toggle is a labelled control in the navbar
  # (layouts/_partials/header.html); disable the theme's floating duplicate
  # so there is exactly one toggle on the page.
  hideColorSchemeToggle = true
  customCSS = ["css/custom.css"]
  # Site code — selects this course's accent from data/accents.yaml
  # (lle: #C72334 light / #E77E89 dark, pentagon mark).
  code = "lle"
  # Content licence, surfaced by pdf attribution + legal pages.
  license = "CC BY-SA 4.0"

  # IMPORTANT — every sub-table under [params] MUST come AFTER all bare
  # [params] keys. TOML scopes everything after a header to that header, so
  # opening [params.plausible] before the keys above would silently move them
  # under params.plausible and leave the site unstyled. Keep this block LAST.
  [params.plausible]
    # Privacy-friendly, cookieless analytics on the author's self-hosted
    # instance (server in Germany); disclosed in /datenschutz/.
    domain = "boulingua.github.io/lle"
    src = "https://plausible.io/js/script.js"

[[params.social]]
  name = "GitHub"
  icon = "fa-brands fa-github fa-2x"
  weight = 1
  url = "https://github.com/boulingua/lle"

